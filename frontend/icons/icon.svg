<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <rect x="16" y="16" width="480" height="480" rx="92" fill="none" stroke="#60a5fa" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Calendar Base Card -->
  <g filter="url(#shadow)">
    <rect x="96" y="120" width="320" height="310" rx="36" fill="#ffffff"/>
    
    <!-- Calendar Top Bar -->
    <path d="M96 156 C96 136.1 112.1 120 132 120 L380 120 C399.9 120 416 136.1 416 156 L416 204 L96 204 Z" fill="url(#shieldGrad)"/>
    
    <!-- Calendar rings/hangers -->
    <rect x="160" y="96" width="24" height="48" rx="12" fill="#e2e8f0"/>
    <rect x="166" y="102" width="12" height="36" rx="6" fill="#94a3b8"/>
    <rect x="328" y="96" width="24" height="48" rx="12" fill="#e2e8f0"/>
    <rect x="334" y="102" width="12" height="36" rx="6" fill="#94a3b8"/>

    <!-- Academic Mortarboard Graduation Cap Icon (Hero Symbol) -->
    <g transform="translate(256, 280) scale(1.15)">
      <!-- Cap Top Diamond -->
      <polygon points="0,-48 78,-16 0,16 -78,-16" fill="#1e3a8a"/>
      <polygon points="0,-48 78,-16 0,-14 -78,-16" fill="#2563eb"/>
      
      <!-- Skull cap lower rim -->
      <path d="M-44 -1 L0 16 L44 -1 L44 24 C44 42 0 54 0 54 C0 54 -44 42 -44 24 Z" fill="#1e40af"/>
      
      <!-- Tassel Button & String -->
      <circle cx="0" cy="-16" r="6" fill="url(#goldGrad)"/>
      <path d="M0 -16 Q48 -10 54 22" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
      <rect x="49" y="22" width="10" height="24" rx="4" fill="url(#goldGrad)"/>
    </g>

    <!-- Verified Badge with Checkmark -->
    <g transform="translate(356, 370)">
      <circle cx="0" cy="0" r="38" fill="#10b981" filter="url(#shadow)"/>
      <path d="M-14 -2 L-4 8 L14 -10" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Event Dots Indicator Grid -->
    <circle cx="150" cy="370" r="10" fill="#3b82f6"/>
    <circle cx="186" cy="370" r="10" fill="#60a5fa"/>
    <circle cx="222" cy="370" r="10" fill="#93c5fd"/>
  </g>
</svg>